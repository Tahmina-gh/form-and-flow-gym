{% extends 'core/base.html' %}{% block content %}<section><div class="wrap" style="max-width:640px"><h2 style="font-size:34px;margin-bottom:18px">Member check-in</h2><form method="post" style="display:flex;gap:10px">{% csrf_token %}<input name="code" placeholder="Scan / type member ID" autofocus><button class="btn btn-primary">Check in / out</button></form>
<div class="box" style="margin-top:22px"><b>Today</b><table>{% for a in today %}<tr><td>{{ a.user.username }}</td><td>{{ a.check_in|date:"H:i" }}</td><td>{{ a.check_out|date:"H:i" }}</td></tr>{% endfor %}</table></div></div></section>{% endblock %}
