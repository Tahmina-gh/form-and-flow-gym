{% extends 'core/base.html' %}{% block content %}<section><div class="wrap"><h2 style="font-size:34px">Book {{ trainer.name }}</h2><form method="get" style="margin:16px 0"><input type="date" name="date" value="{{ date }}" style="max-width:220px;display:inline"> <button class="btn btn-outline btn-sm">Show slots</button></form>
<form method="post">{% csrf_token %}{% for st, taken in slots %}<button name="slot" value="{{ st.isoformat }}" class="pill" {% if taken %}disabled style="opacity:.4"{% endif %}>{{ st|date:"H:i" }}{% if taken %} · taken{% endif %}</button> {% empty %}<p>No slots for that day.</p>{% endfor %}</form></div></section>{% endblock %}
