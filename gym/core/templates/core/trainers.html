{% extends 'core/base.html' %}{% block content %}<section><div class="wrap"><div class="section-head"><h2>Personal <em>trainers</em></h2></div><div class="grid">{% for t in trainers %}<div class="box"><h3>{{ t.name }}</h3><p>{{ t.specialization }} · {{ t.years }} yrs</p><p style="font-size:14px">{{ t.bio }}</p><p>${{ t.session_price|floatformat:0 }} / {{ t.session_minutes }} min</p><a class="btn btn-primary btn-sm" href="{% url 'book_trainer' t.pk %}">Book session</a></div>{% endfor %}</div></div></section>{% endblock %}
